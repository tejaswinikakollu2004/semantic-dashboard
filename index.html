<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dynamic Product Explorer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <h1>Product Explorer</h1>
        <p>Dynamic REST API Client</p>
    </header>


    <main class="container">

        <!-- Search and Filters -->
        <section class="controls">

            <input
                type="search"
                id="searchInput"
                placeholder="Search products..."
                aria-label="Search products"
            >

            <select
                id="categoryFilter"
                aria-label="Filter by category">

                <option value="all">
                    All Categories
                </option>

            </select>

            <select
                id="sortFilter"
                aria-label="Sort products">

                <option value="default">
                    Sort By
                </option>

                <option value="price-low">
                    Price: Low to High
                </option>

                <option value="price-high">
                    Price: High to Low
                </option>

                <option value="name">
                    Name: A-Z
                </option>

            </select>

        </section>


        <!-- Loading / Status Message -->
        <section
            id="statusMessage"
            class="status"
            aria-live="polite">

            Loading products...

        </section>


        <!-- Product Cards -->
        <section
            id="productContainer"
            class="product-grid"
            aria-live="polite">

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <p>
            Task 05 - Dynamic JavaScript DOM Logic & RESTful API Client
        </p>

    </footer>


    <!-- JavaScript -->
    <script
        type="module"
        src="app.js">
    </script>

</body>

</html>
